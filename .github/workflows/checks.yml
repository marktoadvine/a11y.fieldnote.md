name: AFS checks
on: [push, pull_request]
jobs:
  afs-01:
    name: AFS-01 — Markdown structure and examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install checker dependencies
        run: npm ci --ignore-scripts
      - name: Verify Markdown structure and examples
        run: npm run check
