schemaVersion: "0.3.0"
component:
  id: button
  name: Action button
  platform: web
  references:
    - kind: figma
      url: https://www.figma.com/design/EXAMPLE/Button?node-id=1-2
    - kind: storybook
      url: https://example.com/storybook/?path=/story/button--primary
    - kind: code
      path: ../../src/components/button/
example: Illustrative only; design, preview, and code references are placeholders.
benchmarks:
  - name: WCAG
    version: "2.2"
    url: https://www.w3.org/TR/WCAG22/
configurations:
  - id: primary
    name: Primary, enabled
    context: { variant: primary, state: enabled }
  - id: secondary
    name: Secondary, enabled
    context: { variant: secondary, state: enabled }
  - id: primary-disabled
    name: Primary, disabled
    context: { variant: primary, state: disabled }
  - id: primary-forced-colors
    name: Primary with forced colors
    context: { variant: primary, colorMode: forced }
notes:
  - id: native-control
    topic: semantics
    status: decided
    statement: Use a native button for actions.
  - id: visible-label
    status: decided
    statement: Give the button visible text that describes the action.
    owner: content designer
  - id: text-resize
    topic: visual
    status: decided
    statement: Let the label wrap and the button grow when text is enlarged.
  - id: focus-indicator
    topic: focus
    status: decided
    statement: Show a visible outline when focused; hover styling alone is insufficient.
    appliesTo: [primary, secondary, primary-forced-colors]
  - id: secondary-focus-color
    topic: focus
    status: open
    question: Which outline token is distinguishable on the secondary button's supported surfaces?
    appliesTo: [secondary]
  - id: disabled-behavior
    topic: interaction
    status: decided
    statement: Use the native disabled attribute for this configuration; it leaves the tab order and cannot activate.
    appliesTo: [primary-disabled]
  - id: forced-colors
    topic: visual
    status: decided
    statement: Use system colors for the text, boundary, and focus indicator in forced-colors mode.
    appliesTo: [primary-forced-colors]
checks:
  - id: name-check
    notes: [visible-label]
    method: manual
    procedure: Compare the computed accessible name with the visible label.
  - id: focus-check
    notes: [focus-indicator]
    method: manual
    procedure: Tab to the enabled button and inspect the focus outline without hovering.
    appliesTo: [primary, secondary, primary-forced-colors]
  - id: secondary-focus-check
    notes: [focus-indicator, secondary-focus-color]
    method: assisted
    procedure: Measure the focus indicator against the secondary button's adjacent surfaces.
    appliesTo: [secondary]
    test: ./tests/button-focus.test.ts (illustrative test reference)
